name: Verify and publish preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize uploaded hero image
        if: ${{ hashFiles('.tmp/hero/part01.b64') != '' }}
        run: |
          cat \
            .tmp/hero/part01.b64 \
            .tmp/hero/part02.b64 \
            .tmp/hero/part03.b64 \
            .tmp/hero/part04.b64 \
            | tr -d '\n\r ' \
            | base64 --decode \
            > public/domzal-hero.webp

          python - <<'PY'
          from pathlib import Path
          image = Path('public/domzal-hero.webp')
          data = image.read_bytes()
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'Plik nie ma poprawnego nagłówka WebP'
          expected_size = int.from_bytes(data[4:8], 'little') + 8
          assert expected_size == len(data), f'Nieprawidłowy rozmiar obrazu: {len(data)} zamiast {expected_size} B'
          print(f'Zweryfikowano poprawny kontener WebP: {expected_size} B')
          PY

          file public/domzal-hero.webp | grep -q "Web/P image"

          rm -rf .tmp src/data/hero
          rm -f src/data/heroImage.ts src/pages/domzal-hero.webp.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Dodaj przesłane zdjęcie hero jako plik WebP"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify required offer content
        run: |
          grep -q "Mapy do celów projektowych" dist/index.html
          grep -q "Tyczenia i prace realizacyjne" dist/index.html
          grep -q "Geodezyjna obsługa inwestycji" dist/index.html
          grep -q "Podziały nieruchomości" dist/index.html
          grep -q "Granice działek ewidencyjnych" dist/index.html
          grep -q "Inwentaryzacje powykonawcze" dist/index.html
          grep -q "Pomiary związane z geodezją inżynieryjną" dist/index.html
          grep -q "Dokumentacja do decyzji o warunkach zabudowy" dist/index.html
          grep -q "Szkolenie podstawowe ADR dla wszystkich klas" dist/index.html
          grep -q "Szkolenie specjalistyczne ADR dla cystern" dist/index.html
          grep -q "Materiały i przedmioty wybuchowe" dist/index.html
          grep -q "Materiały promieniotwórcze" dist/index.html
          test -s dist/domzal-hero.webp

      - name: Create standalone preview document
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import mimetypes
          import re

          dist = Path('dist')
          html_path = dist / 'index.html'
          html = html_path.read_text(encoding='utf-8')

          def as_data_uri(path_value):
              clean = path_value.split('?', 1)[0].lstrip('/')
              target = dist / clean
              if not target.is_file():
                  return path_value
              mime = mimetypes.guess_type(target.name)[0] or 'application/octet-stream'
              encoded = base64.b64encode(target.read_bytes()).decode('ascii')
              return f'data:{mime};base64,{encoded}'

          for attr in ('src', 'href', 'srcset'):
              pattern = rf'{attr}="(/[^"]+)"'
              html = re.sub(pattern, lambda match: f'{attr}="{as_data_uri(match.group(1))}"', html)

          (dist / 'preview-inline.html').write_text(html, encoding='utf-8')
          PY

      - name: Publish temporary preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preview-site
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: Publish verified preview for ${{ github.sha }}
