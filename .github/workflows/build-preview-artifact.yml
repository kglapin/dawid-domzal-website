name: Build preview artifact

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Rewrite paths for public preview
        env:
          PREVIEW_BASE: https://raw.githack.com/kglapin/dawid-domzal-website/preview-site
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          base = os.environ["PREVIEW_BASE"].rstrip("/")
          for path in Path("dist").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              for attr in ("href", "src", "srcset"):
                  text = text.replace(f'{attr}="/', f'{attr}="{base}/')
                  text = text.replace(f"{attr}='/", f"{attr}='{base}/")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Publish temporary preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: preview-site
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: Publish preview for ${{ github.sha }}
